          const [isVisible, setIsVisible] = useState(false);
          const ref = useRef(null);
          useEffect(() => {
            const observer = new IntersectionObserver(([entry]) => { if (entry.isIntersecting) setIsVisible(true); }, { threshold: 0.1 });

            return () => { if (ref.current) observer.unobserve(ref.current); };
          }, []);
          return [ref, isVisible];
        };

                  <div className="space-y-8">
                    <div className="bg-white p-8 rounded-[2rem] shadow-lg border border-slate-100">
                      <h3 className="text-2xl font-serif text-slate-900 mb-8">Contact Details</h3>

                          <div className="w-12 h-12 rounded-full bg-teal-50 flex items-center justify-center text-teal-600 mr-5 shrink-0"><Phone className="w-6 h-6" /></div>

                        <div className="flex items-start">

                          <div><p className="text-sm text-slate-400 font-bold uppercase tracking-wider mb-1">Hours</p><p className="text-slate-800 text-lg">{BUSINESS_INFO.hours}</p><p className="text-slate-500 text-sm">Closed on Sundays</p></div>
                        </div>
                      </div>
                    </div>

                         <div className="w-16 h-16 bg-teal-50 rounded-2xl flex items-center justify-center text-teal-600 mx-auto mb-6"><item.i className="w-8 h-8" /></div>

                         <div className="bg-slate-50 p-6 rounded-2xl border border-slate-100"><Sparkles className="w-8 h-8 text-purple-500 mb-4" /><h3 className="font-bold text-lg mb-2">Philosophy</h3><p className="text-slate-600 text-sm">Less is more. We prioritize skin barrier health over aggressive treatments.</p></div>
                       </div>
                       <h3 className="text-2xl font-serif mb-8">Our Clinic</h3>
                       <div className="grid grid-cols-2 md:grid-cols-4 gap-4">

                           <div key={i} className="rounded-2xl overflow-hidden shadow-lg h-40 bg-slate-200 relative"><img src={src} alt={`Clinic Interior ${i+1}`} className="w-full h-full object-cover hover:scale-110 transition-transform duration-700" onError={(e) => { e.target.style.display = 'none'; e.target.parentElement.style.backgroundColor = '#e2e8f0'; }} /></div>
                         ))}
                       </div>
                    </div>
                  </div>
                )}
                {view === 'contact' && <ContactView />}
                {view === 'landing' && <LandingPageView />}

              <footer className="bg-slate-900 text-slate-400 py-20 border-t border-slate-800">

                      <p className="mb-8 max-w-sm leading-relaxed text-slate-500">Pune's premier destination for clinical and aesthetic dermatology. Where science meets luxury.</p>
                      <div className="flex gap-4">
                        <a href="https://www.instagram.com/feathertouchpune/" target="_blank" rel="noopener noreferrer" className="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center hover:bg-teal-600 hover:text-white transition-colors cursor-pointer"><Instagram className="w-5 h-5" /></a>

                      <h4 className="text-white font-bold mb-6 uppercase tracking-wider text-xs">Treatments</h4>
                      <ul className="space-y-3 text-sm">{SERVICES.slice(0, 5).map(s => (<li key={s.id} onClick={() => { setActiveService(s); setView('service-detail'); }} className="hover:text-teal-400 cursor-pointer transition-colors">{s.title}</li>))}</ul>
                    </div>
                    <div>
                      <h4 className="text-white font-bold mb-6 uppercase tracking-wider text-xs">Clinic</h4>
                      <ul className="space-y-3 text-sm">
                        <li onClick={() => setView('about')} className="hover:text-teal-400 cursor-pointer transition-colors">About Doctor</li>
                        <li onClick={() => setView('contact')} className="hover:text-teal-400 cursor-pointer transition-colors">Contact & Hours</li>
                        <li onClick={() => setView('landing')} className="text-amber-500 hover:text-amber-400 cursor-pointer transition-colors">Special Offers</li>
                        <li className="pt-4 flex items-center gap-2"><MapPin className="w-4 h-4" /> Koregaon Park, Pune</li>
                      </ul>
                    </div>
                  </div>
                  <div className="border-t border-slate-800 pt-8 flex flex-col md:flex-row justify-between items-center text-xs text-slate-600"><p>© 2024 Feather Touch Dermatology. All rights reserved.</p><div className="flex gap-6 mt-4 md:mt-0"><span>Privacy Policy</span><span>Terms of Service</span><span>Medical Disclaimer</span></div></div>
                </div>
              </footer>
              <div className="lg:hidden fixed bottom-0 left-0 w-full bg-white/90 backdrop-blur-lg border-t border-slate-200 p-4 z-40 flex gap-3 shadow-[0_-4px_20px_rgba(0,0,0,0.05)] pb-safe"><button onClick={openCall} className="flex-1 bg-slate-100 text-slate-900 rounded-xl py-3.5 font-bold flex items-center justify-center active:scale-95 transition-transform"><Phone className="w-5 h-5 mr-2" /> Call</button><button onClick={() => setView('contact')} className="flex-[2] bg-teal-700 text-white rounded-xl py-3.5 font-bold flex items-center justify-center shadow-lg shadow-teal-700/20 active:scale-95 transition-transform">Book Appointment</button></div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
